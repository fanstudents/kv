name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR 的新 commit 不必等舊版 smoke 跑完；push 到 main 保持獨立，避免取消準備合併的證據。
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check install configuration shape
        run: npm run verify:config

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e:run:smoke

      - name: Upload browser smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Fetch schema comparison base
        env:
          CI_SCOPE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CI_SCOPE_BASE_SHA" ] && [ "$CI_SCOPE_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$CI_SCOPE_BASE_SHA" || echo "Unable to fetch comparison base; schema classifier will fail closed."
          fi

      - name: Classify schema gate scope
        id: schema-scope
        env:
          CI_SCOPE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_SCOPE_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-scope.mjs

      - name: Report schema gate skip
        if: steps.schema-scope.outputs.schema-required != 'true'
        run: |
          echo "Schema replay skipped: ${{ steps.schema-scope.outputs.reason }}"

      - name: Install locked dependencies
        if: steps.schema-scope.outputs.schema-required == 'true'
        run: npm ci

      - name: Rehearse local migrations
        if: steps.schema-scope.outputs.schema-required == 'true'
        run: npm run schema:rehearse

      - name: Check generated database types
        if: steps.schema-scope.outputs.schema-required == 'true'
        run: npm run schema:types:check
