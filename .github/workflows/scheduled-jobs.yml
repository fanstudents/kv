name: Scheduled Jobs

# 兩支新的排程：
#   metric-snapshot 每天寫一次目標指標快照——達成率才會有趨勢，而不是只有「現在幾分」
#   kb-recheck      每週重爬一次知識庫的網址來源，內容變了就把相關知識標成待複檢
#
# 兩支都需要 repo secret CRON_SECRET，且必須與伺服器上的環境變數一致；
# 端點是 fail-closed 的，沒帶對密鑰會回 401。

on:
  schedule:
    # 每天 17:10 UTC = 台北時間隔日 01:10（挑離峰時段）
    - cron: "10 17 * * *"
    # 每週一 18:00 UTC = 台北時間週二 02:00
    - cron: "0 18 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: 手動觸發哪一支
        required: true
        default: metric-snapshot
        type: choice
        options: [metric-snapshot, kb-recheck]

jobs:
  metric-snapshot:
    # 每日那條排程，或手動指定
    if: github.event.schedule == '10 17 * * *' || github.event.inputs.job == 'metric-snapshot'
    runs-on: ubuntu-latest
    steps:
      - name: 寫入目標指標的每日快照
        run: |
          curl -fsS --max-time 120 \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            "https://kva.zeabur.app/api/cron/metric-snapshot"

  kb-recheck:
    # 每週那條排程，或手動指定
    if: github.event.schedule == '0 18 * * 1' || github.event.inputs.job == 'kb-recheck'
    runs-on: ubuntu-latest
    steps:
      - name: 重爬知識庫的網址來源，比對內容是否變動
        run: |
          curl -fsS --max-time 300 \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            "https://kva.zeabur.app/api/cron/kb-recheck"
