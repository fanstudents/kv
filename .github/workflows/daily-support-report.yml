name: Daily Support Report

on:
  schedule:
    # 01:00 UTC = 台北時間 09:00
    - cron: "0 1 * * *"
  workflow_dispatch: {}

env:
  APP_BASE: https://kva.zeabur.app

jobs:
  trigger-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger support daily report
        run: |
          curl -fsS --max-time 120 \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            "$APP_BASE/api/cron/support-daily-report"

      # 失敗只在 GitHub 上紅一下是沒有用的——沒有人每天早上會去看 Actions 頁面。
      # 這一步把失敗推回應用，由它送 LINE 告警給總管 Agent 的匯報對象。
      - name: Notify on failure
        if: failure()
        run: |
          curl -fsS --max-time 30 -X POST \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"job":"support-daily-report","detail":"GitHub Actions 呼叫失敗，請看 Actions 紀錄與應用日誌"}' \
            "$APP_BASE/api/cron/alert" || true
